<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ccg-monitor · wireframes</title>
  <link rel="stylesheet" href="linear-tokens.css" />
  <link rel="stylesheet" href="wireframe.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #e8e6e1; }
    #root { height: 100%; }
    /* Counter design-canvas's white card background — our wireframes
       paint their own dark canvas, so the artboard frame should be neutral. */
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Data first (plain JS, defines window.WF_DATA) -->
  <script src="wireframe-data.js"></script>

  <!-- Starter components -->
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <!-- Wireframe primitives + views -->
  <script type="text/babel" src="wireframe-primitives.jsx"></script>
  <script type="text/babel" src="view-workspace.jsx"></script>
  <script type="text/babel" src="view-plan.jsx"></script>
  <script type="text/babel" src="view-activity.jsx"></script>
  <script type="text/babel" src="view-states.jsx"></script>

  <!-- App shell -->
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
